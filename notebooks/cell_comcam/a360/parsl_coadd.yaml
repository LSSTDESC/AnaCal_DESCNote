LSST_VERSION: v30.0.4.rc1
instrumnet: LSSTComCam

pipelineYaml: "/global/homes/x/xiangchl/superonion/code/AnaCal_DESCNote/notebooks/cell_comcam/a360/measure_pipeline_coadd.yaml"
wmsServiceClass: lsst.ctrl.bps.parsl.ParslService
computeSite: work_queue

pipetask:
  cmdlineArgs: ["--register-dataset-types"]

site:
    local:
        class: lsst.ctrl.bps.parsl.sites.Local
        cores: 1
        monitorEnable: true
        monitorFilename: runinfo/monitoring.db
    work_queue:
        # NERSC debug qos: whole-node exclusive, 30-min cap, max 5 submitted.
        class: bps_parsl_sites.SlurmWorkQueue
        nodes_per_block: 1
        cores_per_node: 64
        qos: regular
        constraint: cpu
        exclusive: true
        walltime: "4:30:00"
        account: m1727
        provider_options:
          init_blocks: 1
          min_blocks: 0
          max_blocks: 1
        worker_options: "--cores=64"
        monitorEnable: true
        monitorFilename: runinfo/monitoring.db

payload:
  payloadName: dp1/a360_anacal_coadd
  butlerConfig: /global/cfs/cdirs/lsst/production/gen3/rubin/DP1/repo/butler.yaml
  inCollection: LSSTComCam/DP1,refcats/DM-39298/gaia_dr3_20230707
  dataQuery: >
    (skymap='lsst_cells_v1')
    AND (band in ('g','r','i','z'))
    AND (
      (tract=10463 AND patch in (30,31,32,33,34,40,41,42,43,44,50,51,52,53,54,60,61,62,63,64,70,71,72,73,74,80,81,82,83,84,90,91,92,93,94))
      OR (tract=10464 AND patch in (37,38,39,47,48,49,57,58,59,67,68,69,77,78,79,87,88,89,97,98,99))
      OR (tract=10704 AND patch in (0,1,2,3,4,5))
    )
