LSST_VERSION: v30.0.4.rc1
instrumnet: LSSTComCam

pipelineYaml: "/global/homes/x/xiangchl/superonion/code/AnaCal_DESCNote/notebooks/cell_comcam/a360/measure_pipeline_sim.yaml"
wmsServiceClass: lsst.ctrl.bps.parsl.ParslService
computeSite: work_queue

numberOfRetries: 3
requestMemory: 64000
memoryMultiplier: 1

pipetask:
  cmdlineArgs: ["--register-dataset-types"]

site:
    local:
        class: lsst.ctrl.bps.parsl.sites.Local
        cores: 16
        monitorEnable: true
        monitorFilename: runinfo/monitoring.db
    work_queue:
        class: bps_parsl_sites.SlurmWorkQueue
        # NB: `bps_parsl_sites.SlurmWorkQueue` only recognizes the keys
        # listed in its docstring (nodes_per_block, walltime, qos,
        # constraint, scheduler_options, provider_options, ...).  Extra
        # keys like `slurm_options`, `max_blocks`, `max_workers` are
        # SILENTLY IGNORED.  Set sbatch flags via `scheduler_options`
        # and parsl provider knobs via `provider_options`.
        nodes_per_block: 1
        qos: debug
        constraint: cpu
        walltime: "0:30:00"  # HH:MM:SS  (debug qos cap)
        scheduler_options: |
          #SBATCH --account=m1727
          #SBATCH --ntasks-per-node=8
          #SBATCH --cpus-per-task=1
          #SBATCH --mem=0
        # max_blocks = condor-style array; each block is one sbatch
        # submission of one node.  Bump to add more nodes.
        provider_options:
          init_blocks: 8
          min_blocks: 0
          max_blocks: 8
          parallelism: 1.0
        # `--cores=8` tells the work_queue worker it has 8 cores to fill
        # with concurrent pipetask quanta (matches --ntasks-per-node=8).
        worker_options: "--cores=8"
        monitorEnable: true
        monitorFilename: runinfo/monitoring.db

payload:
  payloadName: dp1/a360_anacal_sim_80_0
  butlerConfig: /global/cfs/cdirs/lsst/production/gen3/rubin/DP1/repo/butler.yaml
  inCollection: u/mgorsuch/metadetect/a360_extra_cells,u/mgorsuch/metadetect/a360_metadetect,u/mgorsuch/metadetect/a360_coadd,LSSTComCam/DP1,refcats/DM-39298/gaia_dr3_20230707
  dataQuery: "skymap='lsst_cells_v1' AND instrument='LSSTComCam'"
