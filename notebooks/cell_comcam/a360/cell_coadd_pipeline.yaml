description: |
  Cell-based coadd FPFS measurement, photo-z, and tract-level merge.

  - measureCellCoadds: detection + per-band forced FPFS measurement on
    the cell coadds, output per-patch deep_cell_coadd_anacal_catalog.
  - photoZ: FlexZBoost photo-z on the per-patch anacal catalog,
    redirected to the cell-coadd dataset names.
  - mergeFpfs: stack the per-patch (anacal + photo-z) catalogs of one
    tract, combine multi-band shapelet moments and update fpfs1_e1/e2
    plus their shear derivatives, then apply the local WCS distortion
    correction (linearize the tract WCS at each detection position).

instrument: lsst.obs.lsst.LsstComCam

tasks:
  measureCellCoadds:
    class: xlens.processor.measure_cell_coadds.MeasureCellCoaddsPipe
    config:
      connections.coaddName: deep
      anacal.do_noise_bias_correction: True
      fpfs.do_noise_bias_correction: True
      fpfs.sigma_shapelets1: 0.54

  photoZ:
    class: xlens.processor.photoz.photoZPipe
    config:
      connections.coaddName: deep
      connections.anacalCatalog: deep_cell_coadd_anacal_catalog
      connections.redshiftCatalog: deep_cell_coadd_anacal_fzb_point
      connections.redshiftPdfs: deep_cell_coadd_anacal_fzb_pdfs
      model_path: /home/xiangchong/work/DP1/model_4bands_fzboost.pkl
      mag_zero: 31.4
      flux_name: fpfs1
      bands: griz
      ref_band: i
      do_distortions: true
      output_pdfs: false

  mergeFpfs:
    class: xlens.processor.merge.MergePipe
    config:
      connections.coaddName: deep
      connections.dataType: catalog
      connections.srcList: deep_cell_coadd_anacal_catalog
      connections.pzList: deep_cell_coadd_anacal_fzb_point
      connections.mergedCatalog: deep_cell_coadd_anacal_catalog_merged
      bands: ["g", "r", "i", "z"]
      mag_zero: 31.4
      fpfs_c0: 8.4
