description: |
  Image simulation + AnaCal measurement driven by the registered cell-coadd
  systematics (PSF + noise-correlation arrays) and combined-band mask.

instrument: lsst.obs.lsst.LsstComCam

tasks:
  catalogShear:
    class: xlens.simulator.catalog.CatalogShearTask
    config:
      connections.catName: dc1_80_0
      galaxy_type: catsim2017
      layout: random
      extend_ratio: 1.08
      sep_arcsec: 14
      z_bounds: [0.0, 0.63, 0.98, 1.48, 10.0]
      mode: 80
      rotId: 0
      test_target: g1
      test_value: 0.02
      kappa_value: 0.0

  measureSimCoadds:
    class: xlens.processor.measure_coadds.MeasureCoaddsPipe
    config:
      connections.inputName: deep_coadd_cell
      connections.outName: deep_coadd_cell_80_0
      connections.catName: dc1_80_0
      use_sim: true
      sim_bands: ["g", "r", "i", "z"]
      simulator.survey_name: lsst
      simulator.mag_zero: 31.4
      simulator.use_real_psf: true
      simulator.draw_image_noise: true
      fpfs.sigma_shapelets1: 0.54
      anacal.do_noise_bias_correction: true
      fpfs.do_noise_bias_correction: true

  photoZ:
    class: xlens.processor.photoz.photoZPipe
    config:
      connections.inputName: deep_coadd_cell_80_0
      model_path: /global/u2/x/xiangchl/superonion/code/model_4bands_fzboost.pkl
      mag_zero: 31.4
      flux_name: fpfs1
      bands: griz
      ref_band: i
      do_distortions: true
      output_pdfs: false

  mergePatches:
    class: xlens.processor.merge.MergePipe
    config:
      connections.inputName: deep_coadd_cell_80_0
      bands: ["g", "r", "i", "z"]
      band_weights:
        - 0.5287963721184084
        - 0.33049707056512084
        - 0.1362332926465851
        - 0.004473264669885652
      mag_zero: 31.4
      fpfs_c0: 8.4
