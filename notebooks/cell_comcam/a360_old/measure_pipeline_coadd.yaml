description: |
  Anacal measurement on REAL deep_coadd exposures (not cell coadds, not
  simulations).

instrument: lsst.obs.lsst.LsstComCam

tasks:
  buildSystematics:
    class: xlens.processor.build_systematics.BuildSystematicsTask

  measureCoadds:
    class: xlens.processor.measure_coadds.MeasureCoaddsPipe
    config:
      use_sim: False
      connections.inputName: deep_coadd
      connections.outName: deep_coadd
      anacal.do_noise_bias_correction: True
      anacal.validate_psf: False
      anacal.psf_model_type: patch
      fpfs.do_noise_bias_correction: True
      fpfs.psf_model_type: patch
      fpfs.sigma_shapelets1: 0.54

  photoZ:
    class: xlens.processor.photoz.photoZPipe
    config:
      connections.inputName: deep_coadd
      model_path: /global/u2/x/xiangchl/superonion/code/model_4bands_fzboost.pkl
      mag_zero: 31.4
      flux_name: fpfs1
      bands: griz
      ref_band: i
      do_distortions: true
      output_pdfs: false

  mergePatches:
    class: xlens.processor.merge.MergePipe
    config:
      connections.inputName: deep_coadd
      bands: ["g", "r", "i", "z"]
      band_weights:
        - 0.5287963721184084
        - 0.33049707056512084
        - 0.1362332926465851
        - 0.004473264669885652
      mag_zero: 31.4
      fpfs_c0: 8.4
