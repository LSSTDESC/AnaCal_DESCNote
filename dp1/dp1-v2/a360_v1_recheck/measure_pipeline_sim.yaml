  catalogShear3:
    class: xlens.simulator.catalog.CatalogShearTask
    config:
      connections.catName: diffsky_80_0
      galaxy_type: diffsky
      layout: random
      extend_ratio: 1.08
      sep_arcsec: 14
      z_bounds: [0.0, 0.63, 0.98, 1.48, 10.0]
      mode: 80
      rotId: 0
      test_target: g1
      test_value: 0.02
      kappa_value: 0.0
      select_observable: ["lsst_i_disk", "lsst_i_bulge"]
      select_lower_limit: [16.0, 16.0]

  measureSimCoadds3:
    class: xlens.processor.measure_coadds.MeasureCoaddsPipe
    config:
      connections.inputName: deep_coadd
      connections.outName: deep_diffsky_coadd_cell_80_0
      connections.catName: diffsky_80_0
      use_sim: true
      sim_bands: ["g", "r", "i", "z"]
      simulator.galaxy_type: diffsky
      simulator.survey_name: lsst
      simulator.mag_zero: 31.4
      simulator.use_real_psf: true
      simulator.draw_image_noise: true
      fpfs.sigma_shapelets1: 0.54
      anacal.do_noise_bias_correction: true
      fpfs.do_noise_bias_correction: true

